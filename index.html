<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>물고기는 어디에</title>
  <meta name="description" content="물고기를 찾아 잠시 멈추고 기다리는 인터랙션">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css">
  <!-- 아래 순서 유지. 모듈 등록이 끝난 뒤 boot.js가 실행됩니다. -->
  <script src="config.js" defer></script>
  <script src="sync-config.js" defer></script>
  <script src="shared/sync-client.js" defer></script>
  <script src="water-background.js" defer></script>
  <script src="shared/run-scope.js" defer></script>
  <script src="shared/stillness.js" defer></script>
  <script src="shared/motion.js" defer></script>
  <script src="app.js" defer></script>
  <script src="interactions/fish05.js" defer></script>
  <!-- 추후 추가할 3개 게임의 script는 이 위/아래에서, boot.js보다 먼저 연결 -->
<script src="home-guide.js" defer></script>
<script src="shared/phone-sync.js" defer></script>
<script src="boot.js" defer></script>
  <link rel="stylesheet" href="home-guide.css">
  <link rel="stylesheet" href="sync.css">
</head>
<body>
  <main id="stage" aria-label="물고기는 어디에" data-screen="home">
    <!-- 공통 홈: 타이포와 안내 그래픽은 homeContent에 추후 추가 -->
    <section id="home" class="scene">

      <canvas id="homeWater" aria-hidden="true"></canvas>
      <div id="homeContent">
        <img class="home-logo" src="assets/logo.png" alt="물고기는 어디에">
        <button id="homeStart" class="home-image-button" type="button">
          <img src="assets/Web page_intro-button.png" alt="시작하기">
      </button>
      </div>

     <div id="homeGuide" hidden>
      <img id="homeGuidePhoto"
          src="assets/Web page_intro-ment1.png"
          alt="첫 번째 안내">

      <img id="homeGuideGif"
          src="assets/intro_girl_walk.gif"
          alt="빈 어항을 들고 걷는 소녀">
      <p class="touch-hint">화면을 터치해 계속하기</p>
</div>
<div id="homeMotionGate" hidden>
  <p id="homeMotionStatus" role="status"></p>
</div>
      <p id="routeNotice" role="status"></p>
    </section>
    <!-- 각 미니게임은 자기 영역 안에서만 화면을 전환합니다. -->
    <section id="interactionScreen" class="scene" hidden>
      <div id="fish05View" class="interaction-view" hidden>
      <!-- 1. 시작 화면 — 터치할 때마다 말풍선 안내 진행 -->
      <section id="intro" class="scene">
        <img class="art intro-one" src="assets/5_01-1.png" alt="이 물고기… 물을 주면 깨어날지도 몰라!">
        <img class="art intro-two" src="assets/5_01-2.png" alt="네가 수도꼭지를 돌려주면 내가 물고기를 구해볼게!">
        <p class="touch-hint">화면을 터치해 계속하기</p>

      </section>
      <!-- 2. 수도꼭지 화면 — 클릭 영역, 호스, 물방울 -->
      <section id="water" class="scene" hidden>
        <img class="art instruction" src="assets/5_02-멘트.png" alt="수도꼭지를 돌려 소녀를 도와주세요">
        <button id="tapButton" aria-label="수도꼭지 돌리기" class="tap-card">
          <span class="shadow">
          </span>
          <img id="hose" src="assets/hose-0.png" alt="" draggable="false">
          <img id="tap" src="assets/tap-0.png" alt="수도꼭지" draggable="false">
        </button>
        <svg class="drop" viewBox="0 0 64 110" role="img" aria-label="물방울 채우기">
          <defs>
            <clipPath id="dropClip">
              <path d="M32 5C25 18 5 51 5 77C5 115 59 115 59 77C59 51 39 18 32 5Z"/>
            </clipPath>
          </defs>
          <path d="M32 5C25 18 5 51 5 77C5 115 59 115 59 77C59 51 39 18 32 5Z" fill="white"/>
          <g clip-path="url(#dropClip)">
            <rect id="fill" x="0" y="110" width="64" height="110" fill="#c6ecf8"/>
          </g>
          <path d="M32 5C25 18 5 51 5 77C5 115 59 115 59 77C59 51 39 18 32 5Z" fill="none" stroke="#b0e1ff" stroke-width="5"/>
        </svg>
        <p id="count" class="sr" aria-live="polite">물을 3번 주세요</p>
      </section>
      </div>
      <!-- 새 게임 화면은 이 안에 독립적인 interaction-view로 추가 -->
    </section>
      <!-- 3. 물고기 등장 / 수평 안내 화면 -->
      <section id="reveal" class="scene" hidden>
        <img id="rays" src="assets/5_back.png" alt="">
        <img id="fishName" class="art fish-name" src="assets/5_03-물고기이름.png" alt="해포리고기">
        <img id="fish" class="art fish" src="assets/5_03-물고기.png" alt="초록색 해포리고기">
        <img id="message" class="art awake" src="assets/5_03-말풍선.png" alt="물고기의 몸에 물이 닿자, 물고기가 깨어났어요!">
        <p class="touch-hint">화면을 터치해 계속하기</p>
        <div id="sensorPanel" class="sensor-panel" hidden>
          <p id="sensorNote">
          </p>
          <button id="simulate" class="quiet secondary" hidden>PC 미리보기 · 수평으로 들기</button>
        </div>
      </section>
      <!-- 4. 기다림 화면 — 영상은 추후 추가 -->
      <section id="ocean" class="scene" hidden>
        <div id="bubbles" aria-hidden="true">
        </div>
        <img id="waitingMessage" class="art waiting" src="assets/5_10-말풍선.png" alt="물고기가 헤엄칠 수 있도록 우리 잠시 기다려보자">
        <p class="touch-hint">화면을 터치해 계속하기</p>
        <img id="endingFish" class="art fish" alt="물고기" hidden>
        <p id="endingStatus" role="status"></p>
        <button id="previewStill" class="quiet secondary" hidden>PC 미리보기 · 3초 정지</button>
        <button id="endingPlay" class="quiet" hidden>물고기 영상 재생하기</button>
        <video id="fishVideo" playsinline muted hidden>
        </video>

      </section>

    <button id="restart" class="quiet" hidden>홈으로</button>
  </main>
  <p id="live" class="sr" aria-live="polite"></p>
  <p id="syncStatus" role="status" hidden></p>
  <!-- PC에서 표시. 휴대폰은 ?debug=1로 켤 수 있습니다. -->
  <aside id="developerPanel" hidden aria-label="편집 미리보기">
    <p class="dev-label">편집 미리보기</p>
    <p id="debugState"></p>
    <div id="interactionPicker"></div>
    <div class="dev-scenes">
      <button id="debugHome">홈</button>
      <button id="debugReveal">물고기 소개</button>
      <button id="debugOcean">기다림 화면</button>
    </div>
    <label for="homeTilt">홈의 물 기울기 <output id="homeTiltValue">0°</output></label>
    <input id="homeTilt" type="range" min="-100" max="100" value="0">
    <p class="dev-help">색·시간·횟수·영상 경로는 config.js에서 수정합니다.</p>
  </aside>
</body>
</html>
