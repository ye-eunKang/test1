<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>물고기는 어디에</title>
  <meta name="description" content="물고기를 찾아 잠시 멈추고 기다리는 인터랙션">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css">
  <!-- 아래 순서 유지. 모듈 등록이 끝난 뒤 boot.js가 실행됩니다. -->
  <script src="config.js" defer></script>
  <script src="sync-config.js" defer></script>
  <script src="shared/sync-client.js" defer></script>
  <script src="water-background.js" defer></script>
  <script src="shared/run-scope.js" defer></script>
  <script src="shared/stillness.js" defer></script>
  <script src="shared/motion.js" defer></script>
  <script src="shared/ending-gif.js" defer></script>
  <script src="shared/horizontal-shake.js" defer></script>
  <script src="shared/item-choices.js" defer></script>
  <script src="app.js" defer></script>
  <script src="interactions/fish05.js" defer></script>
  <script src="interactions/fish01.js" defer></script>
  <script src="interactions/fish02.js" defer></script>
  <script src="interactions/fish06.js" defer></script>
  <!-- 추후 추가할 게임의 script는 이 위/아래에서, boot.js보다 먼저 연결 -->
<script src="home-guide.js" defer></script>
<script src="shared/phone-sync.js" defer></script>
<script src="boot.js" defer></script>
  <link rel="stylesheet" href="home-guide.css">
  <link rel="preload" href="assets/fonts/ownglyph-yooooonjae.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="sync.css">
</head>
<body>
  <!-- GIF 색상은 단일 필터에서 처리해 여러 필터의 반복 합성을 줄입니다. -->
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;pointer-events:none">
    <defs>
      <filter id="homeGirlTint" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0 0 0 0 0.166346  0 0 0 0 0.736283  0 0 0 0 0.813584  0 0 0 1 0"/>
      </filter>
    </defs>
  </svg>
  <main id="stage" aria-label="물고기는 어디에" data-screen="home">
    <!-- 공통 홈: 타이포와 안내 그래픽은 homeContent에 추후 추가 -->
    <section id="home" class="scene">

      <canvas id="homeWater" aria-hidden="true"></canvas>
      <div id="homeContent">
        <img class="home-logo" src="assets/logo.png" alt="물고기는 어디에">
        <button id="homeStart" class="home-image-button" type="button">
          <img src="assets/Web page_intro-button.png" alt="시작하기">
      </button>
      </div>

     <div id="homeGuide" hidden>
      <img id="homeGuidePhoto"
          src="assets/web/Web page_intro-ment1.png"
          width="1024" height="526" decoding="async"
          alt="첫 번째 안내">

      <img id="homeGuideGif"
          src="assets/intro_girl_walk.gif"
          width="1112" height="834" decoding="auto" fetchpriority="high"
          alt="빈 어항을 들고 걷는 소녀">

</div>
<div id="homeMotionGate" hidden>
  <p id="homeMotionStatus" role="status"></p>
</div>
      <p id="routeNotice" role="status"></p>
    </section>
    <!-- 각 미니게임은 자기 영역 안에서만 화면을 전환합니다. -->
    <section id="interactionScreen" class="scene" hidden>
      <div id="fish06View" class="interaction-view" hidden>
        <section id="tradeIntro" class="scene" aria-label="물건 교환 안내">
          <img class="art trade-intro-one" src="assets/fish06/Web page ui_S6-1_ment1.png" alt="이 물고기랑 같이 가고 싶은데…">
          <img class="art trade-intro-two" src="assets/fish06/Web page ui_S6-1_ment2.png" alt="혹시 바꿀 만한 물건이 있을까?">
          <button id="tradeBegin" class="trade-intro-hit" type="button" aria-label="안내를 마치고 물건 고르기 시작"></button>
        </section>
        <section id="tradeGame" class="scene" aria-label="흔들어서 물건 고르기" hidden>
          <img id="tradeInstruction" class="art trade-instruction" src="assets/fish06/Web page ui_S6-2_ment1.png" alt="휴대폰을 좌우로 세게 흔들어 물건을 골라보자!">
          <img id="tradeMentOne" class="art trade-ment-one" alt="" hidden>
          <img id="tradeMentTwo" class="art trade-ment-two" alt="" hidden>
          <div class="trade-card">
            <img id="tradeFrame" src="assets/fish06/Web page ui_S6-2_square.png" alt="" draggable="false">
            <p id="tradePrompt" class="trade-prompt"><span>휴대폰을 좌우로</span><span>세게 흔들어주세요.</span></p>
            <img id="tradeItem" alt="" draggable="false" hidden>
          </div>
          <p id="tradeFeedback" class="trade-feedback" role="status"></p>
          <button id="tradeConfirm" class="trade-confirm" type="button" hidden>이걸로 정했어!</button>
          <button id="tradePreviewShake" class="quiet trade-preview" type="button" hidden>PC 미리보기 · 좌우로 흔들기</button>
        </section>
      </div>
      <div id="fish02View" class="interaction-view" hidden>
        <section id="lpIntro" class="scene" aria-label="LP 안내">
          <img class="art intro-one" src="assets/fish02/intro-1.png" alt="이 LP판에 있는 물고기도 나올 수 있을까?">
          <img class="art intro-two" src="assets/fish02/intro-2.png" alt="음반이 돌아갈 수 있도록 도와줄래?" hidden>
        </section>
        <section id="lpGame" class="scene" aria-label="LP 중심 유지 게임" hidden>
          <img class="art instruction" src="assets/fish02/instruction.png" alt="음반이 넘어지지 않게 중심을 유지하자!">
          <div class="lp-card">
            <img id="lpBase" src="assets/fish02/balance-base.png" alt="음반을 받치는 삼각형" draggable="false">
            <img id="lpRecord" src="assets/fish02/record.png" alt="중심을 잡아야 하는 음반" draggable="false">
          </div>
          <div id="lpProgress" class="lp-progress" role="progressbar" aria-label="중심 유지" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
          <p id="lpFeedback" class="lp-feedback" role="status"></p>
          <label id="lpPreview" class="lp-preview" hidden>PC 미리보기 · 좌우 기울기
            <input id="lpPreviewTilt" type="range" min="-30" max="30" step="1" value="18" aria-label="LP 기울기 미리보기">
          </label>
        </section>
      </div>
      <div id="fish01View" class="interaction-view" hidden>
        <section id="dishIntro" class="scene">
          <img class="art intro-one" src="assets/fish01/intro-1.png" alt="저 아래에서 물고기의 기운이 느껴져…">
          <img class="art intro-two" src="assets/fish01/intro-2.png" alt="그릇을 옮기는 걸 도와줄래? 깨지지 않게 조심히 옮겨줘!" hidden>
        </section>
        <section id="dishGame" class="scene" hidden>
          <img class="art instruction" src="assets/fish01/instruction.png" alt="접시 아래 갇힌 물고기를 구해주자!">
          <button id="dishTray" class="dish-tray" type="button" aria-label="그릇 사진을 꾹 누른 채 첫 번째 접시를 아래로 천천히 옮기기">
            <img src="assets/fish01/dishes.png" alt="여러 그릇이 담긴 바구니" draggable="false">
          </button>
          <img id="dishPlatform" class="dish-platform" src="assets/fish01/platform.png" width="2048" height="633" decoding="async" alt="" draggable="false" aria-hidden="true">
          <div id="dishStack" class="dish-stack" aria-label="옮긴 접시">
            <img src="assets/fish01/plate-1.png" alt="큰 꽃무늬 접시" hidden>
            <img src="assets/fish01/plate-2.png" alt="작은 테두리 접시" hidden>
            <img src="assets/fish01/plate-3.png" alt="그릇" hidden>
          </div>
          <button id="dishMoving" class="dish-moving" type="button" aria-label="접시를 아래 그림자까지 천천히 끌어 놓기" hidden>
            <img id="dishMovingImage" alt="" draggable="false">
          </button>
          <p id="dishFeedback" class="dish-feedback" role="status"></p>
          <p id="dishCount" class="sr" aria-live="polite">접시 0개 / 3개</p>
        </section>
      </div>
      <div id="fish05View" class="interaction-view" hidden>
      <!-- 1. 시작 화면 — 터치할 때마다 말풍선 안내 진행 -->
      <section id="intro" class="scene">
        <img class="art intro-one" src="assets/5_01-1.png" alt="이 물고기… 물을 주면 깨어날지도 몰라!">
        <img class="art intro-two" src="assets/5_01-2.png" alt="네가 수도꼭지를 돌려주면 내가 물고기를 구해볼게!">

      </section>
      <!-- 2. 수도꼭지 화면 — 클릭 영역, 호스, 물방울 -->
      <section id="water" class="scene" hidden>
        <img class="art instruction" src="assets/5_02-멘트.png" alt="수도꼭지를 돌려 소녀를 도와주세요">
        <div class="tap-card">
          <span class="shadow">
          </span>
          <span class="tap-assembly">
            <img id="hose" src="assets/hose-0.png" alt="" draggable="false">
            <button id="tapButton" class="tap-target" type="button" aria-label="수도꼭지 돌리기">
              <img id="tap" src="assets/tap-0.png" alt="" draggable="false">
            </button>
          </span>
        </div>
        <svg class="drop" viewBox="0 0 64 110" role="img" aria-label="물방울 채우기">
          <defs>
            <clipPath id="dropClip">
              <path d="M32 5C25 18 5 51 5 77C5 115 59 115 59 77C59 51 39 18 32 5Z"/>
            </clipPath>
          </defs>
          <path d="M32 5C25 18 5 51 5 77C5 115 59 115 59 77C59 51 39 18 32 5Z" fill="white"/>
          <g clip-path="url(#dropClip)">
            <rect id="fill" x="0" y="110" width="64" height="110" fill="#c6ecf8"/>
          </g>
          <path d="M32 5C25 18 5 51 5 77C5 115 59 115 59 77C59 51 39 18 32 5Z" fill="none" stroke="#b0e1ff" stroke-width="5"/>
        </svg>
        <p id="count" class="sr" aria-live="polite">물을 3번 주세요</p>
      </section>
      </div>
      <!-- 새 게임 화면은 이 안에 독립적인 interaction-view로 추가 -->
    </section>
      <!-- 3. 물고기 등장 / 수평 안내 화면 -->
      <section id="reveal" class="scene" hidden>
        <img id="rays" src="assets/web/5_end_rays.png" decoding="async" alt="">
        <img id="fishName" class="art fish-name" src="assets/web/5_03-물고기이름.png" decoding="async" alt="해포리고기">
        <img id="fish" class="art fish" src="assets/web/5_03-물고기.png" decoding="async" alt="초록색 해포리고기">
        <img id="message" class="art awake" src="assets/web/5_03-말풍선.png" decoding="async" alt="물고기의 몸에 물이 닿자, 물고기가 깨어났어요!">
        <div id="sensorPanel" class="sensor-panel" hidden>
          <p id="sensorNote">
          </p>
          <button id="simulate" class="quiet secondary" hidden>PC 미리보기 · 수평으로 들기</button>
        </div>
      </section>
      <!-- 4. 수평 유지 → GIF 한 번 → 홈 -->
      <section id="ocean" class="scene" hidden>
        <div id="bubbles" aria-hidden="true">
        </div>
        <img id="waitingMessage" class="art waiting" src="assets/web/5_10-말풍선.png" decoding="async" alt="물고기가 헤엄칠 수 있도록 우리 잠시 기다려보자">
        <img id="endingFish" class="art fish" alt="물고기" hidden>
        <div id="endingMedia" hidden></div>
        <p id="endingStatus" role="status"></p>
        <button id="previewStill" class="quiet secondary" hidden>PC 미리보기 · 3초 정지</button>
        <button id="endingPlay" class="quiet" hidden>물고기 영상 재생하기</button>
        <video id="fishVideo" playsinline muted hidden>
        </video>

      </section>

  </main>
  <p id="live" class="sr" aria-live="polite"></p>
  <p id="syncStatus" role="status" hidden></p>
  <!-- PC에서 표시. 휴대폰은 ?debug=1로 켤 수 있습니다. -->
  <aside id="developerPanel" hidden aria-label="편집 미리보기">
    <p class="dev-label">편집 미리보기</p>
    <p id="debugState"></p>
    <div id="interactionPicker"></div>
    <div class="dev-scenes">
      <button id="debugHome">홈</button>
      <button id="debugReveal">물고기 소개</button>
      <button id="debugOcean">기다림 화면</button>
    </div>
    <label for="homeTilt">홈의 물 기울기 <output id="homeTiltValue">0°</output></label>
    <input id="homeTilt" type="range" min="-100" max="100" value="0">
    <p class="dev-help">색·시간·횟수·영상 경로는 config.js에서 수정합니다.</p>
  </aside>
</body>
</html>
