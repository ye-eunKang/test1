<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>물고기는 어디에 · 디스플레이</title>
  <link rel="stylesheet" href="display.css">
  <script src="sync-config.js" defer></script>
  <script src="shared/sync-client.js" defer></script>
  <script src="display.js" defer></script>
</head>
<body>
  <main id="displayStage" aria-label="물고기는 어디에 디스플레이">
    <img id="displayGameBack" class="display-game-layer" alt="" aria-hidden="true" draggable="false" decoding="async" fetchpriority="low" hidden>
    <video id="displayVideo" playsinline preload="auto"></video>
    <img id="displayGameGraphic" class="display-game-layer" alt="" aria-hidden="true" draggable="false" decoding="async" fetchpriority="low" hidden>
  </main>
  <div id="displayGate"><button id="displayStart" type="button">디스플레이 시작하기</button></div>
  <p id="displayStatus" role="status"></p>
</body>
</html>
